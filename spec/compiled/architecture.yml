- id: test_personas_unit
  dimension: Atomic
  status: clean
  associated_file: tests/unit/test_personas.py
  description: 'Glob-based AV-table structural validator for all ddo/personas/*.md
    files using stdlib re only (no Markdown parser). Asserts per-persona: directory
    guard (must contain files), AV-NN ID format, sequentiality from AV-01, uniqueness;
    snake_case raw-underscore Names (^[a-z][a-z0-9_]*$, no __, no trailing _); no
    escaped underscores; no literal pipe in When-to-apply cells; non-empty columns;
    sentinel-absence. Includes negative-case parity tests (bad_sentinel, bad_escaped,
    bad_nonseq). Parametrized over discovered personas via glob so ddo-create-persona
    output is automatically covered without hardcoding persona names.

    '
  inputs: []
  outputs: []
  edges:
    depends_on:
    - ddo_personas
    implements:
    - tests_unit
- id: test_slug_containment_unit
  dimension: Atomic
  status: clean
  associated_file: tests/unit/test_slug_containment.py
  description: 'Unit tests for ddo.paths.sanitize_slug and assert_within_documents.
    Validates [a-z0-9-] charset enforcement, ``..`` and path-separator prevention,
    80-char cap, fallback for degenerate input, and PathContainmentError on traversal
    attempts.

    '
  inputs: []
  outputs: []
  edges:
    depends_on:
    - path_deriver
    implements:
    - tests_unit
- id: review_engine
  dimension: Atomic
  status: clean
  associated_file: ddo/review.py
  description: 'Critique/interview data layer for the DDO adversarial loop (ddo.review).
    Structural validation: validate_report and validate_interview_log enforce fixed
    enums (severity, decision) and required fields (M1). Version derivation: report_version
    returns max(existing N)+1, current_version returns max N or None (M2). Torn-pass
    detection: flags report-without-log and source-newer-than-history. Write operations:
    write_report and write_interview_log delegate to atomic_write with sort_keys=False.
    View generation: render_report_view and render_history_view produce byte-deterministic
    Markdown from stored YAML. Flag updates: mark_findings sets decision_recorded
    or applied on specific findings and regenerates the view. History tracking: append_history
    accumulates pass records and flags phantom entries when artifacts are missing.

    '
  inputs:
  - data_type: red_team_report_yaml
    source_id: skill_red_team
  - data_type: interview_log_yaml
    source_id: skill_interview
  outputs:
  - data_type: review_history_artifacts
    target_id: documents_output
  edges:
    depends_on:
    - ingest_helpers
    - path_deriver
    - validation_gate
    implements:
    - ddo_core
- id: refine_engine
  dimension: Atomic
  status: clean
  associated_file: ddo/refine.py
  description: 'Mutation layer for the DDO adversarial loop (ddo.refine). Parse layer:
    parse_path hand-rolls a dot/bracket DSL (never eval/exec) into a list of keys/indices.
    Apply layer: apply_patches is pure (no I/O, deep copy only), applies set/append/delete/insert
    operations with strict validation (leaf-scalar only, no auto-vivify, no type change,
    no wholesale section replacement). Structural guard: refine_structural_check validates
    meta/content remain dicts, sections remains a list, bodies remain non-empty strings
    (D5 preserved). Snapshot: snapshot_source copies document_data.yaml byte-for-byte
    to document_data_pre_vN.yaml before mutation (RT#2/M9). Commit: commit_refine
    double-checks with refine_structural_check + validate in-memory, then serializes
    with sort_keys=False and atomic_writes to Documents/ (RT#3).

    '
  inputs:
  - data_type: interview_log_yaml
    source_id: skill_interview
  - data_type: document_data_yaml
    source_id: documents_output
  outputs:
  - data_type: document_data_yaml
    target_id: documents_output
  edges:
    depends_on:
    - ingest_helpers
    - path_deriver
    - validation_gate
    - review_engine
    implements:
    - ddo_core
- id: skill_red_team
  dimension: Atomic
  status: clean
  associated_file: ddo/skills/ddo-red-team.md
  description: 'HACF cognitive node for the Red Team phase of the adversarial loop.
    Mandatory fresh-context firewall: does not inherit authoring/ingest/render history;
    only handoff is path to rendered MD/HTML. Execution: (1) Detects torn-pass via
    review.detect_incomplete_pass and halts if prior pass incomplete. (2) Derives
    version via review.report_version (max existing N + 1; 1 if none). (3) Resolves
    persona from explicit CLI arg or meta.persona (loaded from document_data.yaml);
    stem-validates against ^[a-z][a-z0-9_]*$ before any Read (RT-10); hard-fails
    naming missing file + listing available personas if file not found; scans for
    ## Attack Vectors table and hard-fails if absent (RT-05). (4) Reads rendered
    MD/HTML file (never PDF). (5) Applies persona attack-vector taxonomy, generates
    findings with id, severity (fixed enum: Critical|Major|Minor), category (free-text),
    location, description, suggestion. (6) Writes red_team_report_vN.yaml (machine-readable)
    and deterministic red_team_view_vN.md (code-generated, human-only, never re-parsed)
    via review.write_report. (7) Soft-warns if findings > 100 (advisory cap). (8)
    Echoes AV table and resolved persona + style profile in report header. Halts at
    [WAITING FOR USER REVIEW] and instructs fresh context before ddo-interview.

    '
  inputs:
  - data_type: rendered_markdown
    source_id: build_orchestrator
  - data_type: persona_lens
    source_id: ddo_personas
  outputs:
  - data_type: red_team_report_yaml
    target_id: review_engine
  edges:
    depends_on:
    - review_engine
