nodes:
- id: ddo_system
  dimension: System
  status: clean
  associated_file: spec/compiled/SuperPRD_v0.0.2_AdversarialLoop.md
  description: 'End-to-end DDO pipeline: Ingest \u2192 Render \u2192 Red Team \u2192 Interview \u2192
    Refine. Transforms structured YAML into reproducible PDFs, HTML, and Markdown
    via a 5-phase, HITL-gated state machine with zero-hallucination guarantee. v0.0.2
    complete: ddo.review data layer (structural contracts, atomic writes, _vN derivation,
    torn-pass detection), ddo.refine mutation layer (hand-rolled path DSL parser,
    constrained pure apply_patches, pre-refine snapshots, validate-before-write),
    and three adversarial-loop skills (ddo-red-team, ddo-interview, ddo-refine) mediating
    human-in-the-loop gap-closing.

    '
  inputs:
  - data_type: raw_source_documents
    source_id: external_sources
  outputs:
  - data_type: rendered_artifacts
    target_id: documents_output
  edges:
    depends_on: []
    implements: []
- id: ddo_core
  dimension: Module
  status: clean
  associated_file: ddo/
  description: 'Core DDO Python package (ddo/). Seven core modules: build.py (hermetic
    PEP 723 render orchestrator with timeout/size guards), validation.py (importable
    validation gate: contract + evidence integrity + sentinel detection), paths.py
    (pure path sanitization and containment enforcement), ingest.py (atomic write
    + crash-safe temp→replace pipeline + fabrication tripwire), review.py (critique/interview
    data layer: structural contracts, atomic + contained writes, deterministic view
    generation, _vN derivation, torn-pass detection), refine.py (mutation layer:
    hand-rolled path-DSL parser, constrained pure apply_patches, refine-only structural
    check, pre-refine snapshots, validate-before-write commit). All rendering and
    adversarial-loop mutations flow through this module; it enforces zero-hallucination
    and safety invariants.

    '
  inputs:
  - data_type: document_data_yaml
    source_id: documents_output
  - data_type: cli_args
    source_id: ddo_skills
  outputs:
  - data_type: rendered_artifacts
    target_id: documents_output
  - data_type: review_history_artifacts
    target_id: documents_output
  edges:
    depends_on:
    - ddo_templates
    - ddo_schemas
    implements:
    - ddo_system
- id: ddo_templates
  dimension: Module
  status: clean
  associated_file: ddo/templates/
  description: "Typst (.typst) and Jinja2 (.jinja2) rendering templates for each document-type\
    \ \xD7 format combination (prd/scientific_report \xD7 pdf/html/md). Templates\
    \ are resolved strictly from CLI flags by build.py, never from meta.\n"
  inputs:
  - data_type: document_data_yaml
    source_id: ddo_core
  outputs:
  - data_type: rendered_text_or_pdf
    target_id: ddo_core
  edges:
    depends_on: []
    implements:
    - ddo_system
- id: ddo_schemas
  dimension: Module
  status: clean
  associated_file: ddo/schemas/
  description: 'YAML schema definitions (prd.yaml, scientific_report.yaml) encoding
    the minimal contract every document_data.yaml must satisfy: a meta block and an
    evidence_bank array. Authoritative reference for the ddo-ingest skill and the
    validation gate.

    '
  inputs: []
  outputs:
  - data_type: schema_contract
    target_id: ddo_core
  edges:
    depends_on: []
    implements:
    - ddo_system
- id: ddo_personas
  dimension: Module
  status: clean
  associated_file: ddo/personas/
  description: 'Adversarial review lens definitions (product_critic.md, scientific_reviewer.md)
    used by the Red Team and Interview phases to critique rendered documents from
    domain-specific perspectives.

    '
  inputs: []
  outputs:
  - data_type: review_lens
    target_id: ddo_system
  edges:
    depends_on: []
    implements:
    - ddo_system
- id: ddo_skills
  dimension: Module
  status: clean
  associated_file: ddo/skills/
  description: 'Five HACF cognitive node skill definitions orchestrating the complete
    DDO pipeline: ddo-ingest.md (load source materials, derive meta, write document_data.yaml
    via ddo.ingest), ddo-render.md (invoke build.py with template/format flags), ddo-red-team.md
    (fresh-context adversarial critique against persona lens, version derivation, atomic
    report+view write via ddo.review), ddo-interview.md (paced batched Q&A resolving
    findings to interview_log_vN.yaml, mark findings decision_recorded), ddo-refine.md
    (snapshot source, apply validated patches, present Before/After diff for approval,
    commit via ddo.refine, re-render, mark applied and append history). Skills delegate
    all deterministic safety mechanics (path derivation, validation, mutation, atomic
    writes) to ddo_core and never re-implement them.

    '
  inputs:
  - data_type: source_materials
    source_id: external_sources
  outputs:
  - data_type: document_data_yaml
    target_id: ddo_core
  - data_type: review_decisions
    target_id: ddo_core
  edges:
    depends_on:
    - ddo_core
    - ddo_schemas
    implements:
    - ddo_system
- id: tests_unit
  dimension: Module
  status: clean
  associated_file: tests/unit/
  description: "Unit test suite (tests/unit/) covering all DDO core modules. 13 test\
    \ files, 150+ tests, all pure (no subprocess, no filesystem mutations beyond tmp_path).\
    \ test_validation_gate.py: 25 tests covering meta/evidence_bank contract, ID uniqueness/integrity,\
    \ sentinel detection, orphan warnings. test_ingest_helpers.py: atomic_write overwrite\
    \ guard, crash-safety via temp\u2192replace, fabrication_tripwire token detection.\
    \ test_slug_containment.py: slug sanitization ([a-z0-9-] charset, 80-char cap,\
    \ [..] + separator prevention, PathContainmentError). test_personas.py: persona\
    \ file existence + structure validation. test_fixture_signoff_guard.py: pure functions\
    \ fixtures_touched/is_signed_off/assert_fixture_signoff isolated from git. test_review.py:\
    \ 40+ tests of ddo.review \u2014 validate_report/validate_interview_log contracts,\
    \ _vN derivation (max+1, gap handling), torn-pass detection (report-without-log,\
    \ source-newer), write operations, flag updates (decision_recorded, applied),\
    \ history accumulation, deterministic view/history generation. test_refine.py:\
    \ 46+ tests of ddo.refine \u2014 parse_path DSL grammar validation, apply_patches purity\
    \ (no input mutation), constrained set (leaf-scalar only, no auto-vivify, no type\
    \ change), M3-M9 invariants (byte-unchanged-on-abort, validate-clean, key-order\
    \ preservation, corruption rejection, pre-refine snapshot rollback).\n"
  inputs: []
  outputs: []
  edges:
    depends_on:
    - ddo_core
    - scripts
    implements: []
- id: tests_integration
  dimension: Module
  status: clean
  associated_file: tests/integration/
  description: "Integration test suite (tests/integration/) driving real end-to-end\
    \ DDO pipeline execution via subprocess uv run; all human-gated via DDO_FIXTURE_SIGNOFF=1.\
    \ test_render_determinism.py (M1-M3b): both example YAML files render to pdf/html/md\
    \ with exit 0; HTML/MD outputs byte-identical across runs (normalized LF+strip);\
    \ PDF text layer identical across wall-clock runs; --timestamp determinism (M3b:\
