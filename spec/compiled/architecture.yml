- id: skill_interview
  dimension: Atomic
  status: clean
  associated_file: ddo/skills/ddo-interview.md
  description: "HACF cognitive node for the Interview phase of the adversarial loop.\
    \ (0) Resolves style_profile upfront (stem-validates, hard-fails on missing/invalid,\
    \ reads as untrusted phrasing-only guidance scoped to revise patches targeting\
    \ content.sections[*].body only). Loads red_team_report_vN.yaml (machine-readable),\
    \ filters applied:false findings, sorts by severity (Critical \u2192 Major \u2192\
    \ Minor). Presents findings in batches (default 2 per turn). For each finding,\
    \ user selects revise|add_evidence|acknowledge|dispute|defer. For patch-producing\
    \ decisions (revise/add_evidence), constructs patch operations (set/append/delete/insert)\
    \ with path DSL targets; revise prose respects style profile, add_evidence remains\
    \ verbatim. For non-patch decisions, sets patch=null. Writes interview_log_vN.yaml\
    \ via review.write_interview_log. Marks resolved findings decision_recorded:true\
    \ via review.mark_findings. Halts at [WAITING FOR USER RESPONSE] per batch.\n"
  inputs:
  - data_type: red_team_report_yaml
    source_id: review_engine
  - data_type: document_data_yaml
    source_id: documents_output
