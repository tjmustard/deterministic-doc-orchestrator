nodes:
- id: ddo_system
  dimension: System
  status: clean
  associated_file: spec/compiled/SuperPRD_v0.0.6_ExpandedEcosystemTutorials.md
  description: 'End-to-end DDO pipeline: Ingest \u2192 Render \u2192 Red Team \u2192 Interview \u2192 Refine.
    Transforms structured YAML into reproducible PDFs, HTML, and Markdown via a 5-phase,
    HITL-gated state machine with zero-hallucination guarantee. v0.0.6 complete: seven
    document types (prd, scientific_report, blog_post, meeting_notes, meeting_agenda,
    project_report, plus tutorial types), six personas, seven styles, three tutorials
    demonstrating the evidence-bank workflow, custom-structure authoring, and persona-creation.
    Anti-rot guards enforce fixture mirroring, persona/style reference CI-verification,
    and output-file determinism. v0.0.5 foundation: style-profile support (untrusted
    phrasing-only guidance scoped to content.sections[*].body), injected via ddo-ingest
    and ddo-interview, render-invisible. v0.0.2 foundation: ddo.review data layer (structural
    contracts, atomic writes, _vN derivation, torn-pass detection), ddo.refine mutation
    layer (hand-rolled path DSL parser, constrained pure apply_patches, pre-refine snapshots,
    validate-before-write), three adversarial-loop skills (ddo-red-team, ddo-interview,
    ddo-refine).

    '
  inputs:
  - data_type: raw_source_documents
    source_id: external_sources
  outputs:
  - data_type: rendered_artifacts
    target_id: documents_output
  edges:
    depends_on: []
    implements: []
- id: ddo_core
  dimension: Module
  status: clean
  associated_file: ddo/
  description: "Core DDO Python package (ddo/). Seven core modules: build.py (hermetic\
    \ PEP 723 render orchestrator with CLI-authoritative --template/--format flags,\
    \ timeout/size guards, template/font resolution, Typst + Jinja2 rendering), validation.py\
    \ (importable validation gate: meta/evidence_bank contract, evidence integrity, sentinel\
    \ detection, style-profile stem validation), paths.py (pure path sanitization and containment\
    \ enforcement), ingest.py (atomic write + crash-safe temp\u2192replace pipeline + fabrication\
    \ tripwire), review.py (critique/interview data layer: structural contracts, atomic\
    \ + contained writes, deterministic view generation, _vN derivation, torn-pass detection),\
    \ refine.py (mutation layer: hand-rolled path-DSL parser, constrained pure apply_patches,\
    \ refine-only structural check, pre-refine snapshots, validate-before-write commit).\
    \ All rendering and adversarial-loop mutations flow through this module; it enforces\
    \ zero-hallucination and safety invariants. v0.0.6 adds: style profile stem validation\
    \ gate, persona/style resolution patterns, extended templates for four new document\
    \ types.\n"
  inputs:
  - data_type: document_data_yaml
    source_id: documents_output
  - data_type: cli_args
    source_id: ddo_skills
  outputs:
  - data_type: rendered_artifacts
    target_id: documents_output
  - data_type: review_history_artifacts
    target_id: documents_output
  edges:
    depends_on:
    - ddo_templates
    - ddo_schemas
    implements:
    - ddo_system
- id: ddo_templates
  dimension: Module
  status: dirty
  associated_file: ddo/templates/
  description: 'Typst (.typst) and Jinja2 (.jinja2) rendering templates for each document-type
    x format combination. Six document types are shipped (prd, scientific_report,
    blog_post, meeting_notes, meeting_agenda, project_report), each with all three
    formats (pdf/html/md), so 18 template files total. Templates are resolved strictly
    from CLI flags by build.py, never from meta, and are pure functions of the YAML
    (no clock/locale reads).

    '
  inputs:
  - data_type: document_data_yaml
    source_id: ddo_core
  outputs:
  - data_type: rendered_text_or_pdf
    target_id: ddo_core
  edges:
    depends_on: []
    implements:
    - ddo_system
- id: ddo_schemas
  dimension: Module
  status: dirty
  associated_file: ddo/schemas/
  description: 'YAML schema definitions encoding the minimal contract every document_data.yaml
    must satisfy: a meta block and an evidence_bank array. Six schemas are shipped:
    prd.yaml, scientific_report.yaml, blog_post.yaml, meeting_notes.yaml, meeting_agenda.yaml,
    project_report.yaml. Authoritative reference for the ddo-ingest skill and validation
    gate. Every schema declares an optional meta.style_profile field immediately after
    persona, each with its own default (e.g. prd.yaml -> formal_professional, blog_post.yaml
    -> blog_casual), resolving to ddo/styles/<stem>.md; if absent, no style anchoring
    is applied. Field is render-invisible and validation.py (importable gate) ignores
    it.

    '
  inputs: []
  outputs:
  - data_type: schema_contract
    target_id: ddo_core
  edges:
    depends_on: []
    implements:
    - ddo_system
- id: ddo_personas
  dimension: Module
  status: dirty
  associated_file: ddo/personas/
  description: 'Adversarial review lens definitions used by the Red Team and Interview
    phases to critique rendered documents from domain-specific perspectives. Six personas
    are shipped: product_critic.md, scientific_reviewer.md, content_editor.md, meeting_recorder.md,
    meeting_facilitator.md, project_stakeholder.md (all v0.0.4 AV-table format). Auto-covered
    by the glob-based test_personas.py.

    '
  inputs: []
  outputs:
  - data_type: review_lens
    target_id: ddo_system
  edges:
    depends_on: []
    implements:
    - ddo_system
- id: ddo_skills
  dimension: Module
  status: clean
  associated_file: ddo/skills/
  description: 'Seven HACF cognitive node skill definitions orchestrating the complete
    DDO pipeline and ecosystem authoring: ddo-ingest.md (load source materials, derive
    meta, write document_data.yaml via ddo.ingest), ddo-render.md (invoke build.py
    with CLI-authoritative --template/--format flags), ddo-red-team.md (fresh-context
    adversarial critique against persona lens, version derivation, atomic report+view
    write via ddo.review, stem-validates persona and style_profile references), ddo-interview.md
    (paced batched Q&A resolving findings to interview_log_vN.yaml, mark findings
    decision_recorded, applies style-profile guidance to patch prose), ddo-refine.md
    (snapshot source, apply validated patches, present Before/After diff for HITL
    approval, commit via ddo.refine, re-render, mark applied and append history).
    v0.0.6 adds: ddo-create-persona.md (interactive guided Q&A for authoring AV-NN
    table personas, cognitive-only overwrite guard), ddo-create-style.md (interactive
    guided Q&A for authoring style profiles, rejects content-bearing imperatives,
    cognitive-only overwrite guard). Skills delegate all deterministic safety mechanics
    (path derivation, validation, mutation, atomic writes) to ddo_core and never
    re-implement them.

    '
  inputs:
  - data_type: source_materials
    source_id: external_sources
  outputs:
  - data_type: document_data_yaml
    target_id: ddo_core
  - data_type: review_decisions
    target_id: ddo_core
  edges:
    depends_on:
    - ddo_core
    - ddo_schemas
    implements:
    - ddo_system
- id: tests_unit
  dimension: Module
  status: dirty
  associated_file: tests/unit/
  description: "Unit test suite (tests/unit/) covering all DDO core modules. 8 test\
    \ files, 200+ tests, all pure (no subprocess, no filesystem mutations beyond tmp_path).\
    \ test_validation_gate.py: 25 tests covering meta/evidence_bank contract, ID uniqueness/integrity,\
    \ sentinel detection, orphan warnings. test_ingest_helpers.py: atomic_write overwrite\
    \ guard, crash-safety via temp\u2192replace, fabrication_tripwire token detection.\
    \ test_slug_containment.py: slug sanitization ([a-z0-9-] charset, 80-char cap,\
    \ [..] + separator prevention, PathContainmentError). test_personas.py: AV-NN\
    \ ID format, sequentiality, uniqueness, snake_case Names validation, sentinel-absence.\
    \ test_styles.py: (v0.0.5) title heading, five required ## section headings, non-empty\
    \ bodies, sentinel-absence, parametrized via glob. test_fixture_signoff_guard.py:\
    \ pure functions fixtures_touched/is_signed_off/assert_fixture_signoff isolated\
    \ from git. test_review.py: 40+ tests of ddo.review \u2014 validate_report/validate_interview_log\
    \ contracts, _vN derivation (max+1, gap handling), torn-pass detection (report-without-log,\
    \ source-newer), write operations, flag updates (decision_recorded, applied),\
    \ history accumulation, deterministic view/history generation. test_refine.py:\
    \ 46+ tests of ddo.refine \u2014 parse_path DSL grammar validation, apply_patches\
    \ purity (no input mutation), constrained set (leaf-scalar only, no auto-vivify,\
    \ no type change), M3-M9 invariants (byte-unchanged-on-abort, validate-clean,\
    \ key-order preservation, corruption rejection, pre-refine snapshot rollback).\n"
  inputs: []
  outputs: []
  edges:
    depends_on:
    - ddo_core
    - scripts
    implements: []
- id: tests_integration
  dimension: Module
  status: dirty
  associated_file: tests/integration/
  description: 'Integration test suite (tests/integration/) driving real end-to-end
    DDO pipeline execution via subprocess uv run; all human-gated via DDO_FIXTURE_SIGNOFF=1.
    test_render_determinism.py (M1-M3b): both example YAML files render to pdf/html/md
    with exit 0; HTML/MD outputs byte-identical across runs (normalized LF+strip);
    PDF text layer identical across wall-clock runs; --timestamp determinism (M3b:
    same timestamp yields byte-for-byte identical PDFs); optional golden regression
    baseline comparison (skips without sign-off). test_ingest_contract.py (M5): promoted
    fixture (tests/fixtures/ingest_output.yaml) passes validate() and renders all
    3 formats; skips gracefully until signed off; agents must never author this file.
    test_loop.py (M5 adversarial loop): human-gated end-to-end gap-closing pass with
    fixtures (document_data_with_gap.yaml, interview_log_v1.yaml) in tests/fixtures/loop/;
    asserts (M5.1) no [[DDO::REQUIRES_INPUT:]] sentinel in patched dict, (M5.2) committed
    YAML passes validate(), (M5.3) build.py renders all 3 formats with exit 0; does
    NOT assert semantic correctness (human responsibility).

    '
  inputs: []
  outputs: []
  edges:
    depends_on:
    - ddo_core
    - ddo_schemas
    implements: []
- id: scripts
  dimension: Module
  status: clean
  associated_file: scripts/
  description: 'Project utility and enforcement scripts. Currently contains fixture_signoff_guard.py
