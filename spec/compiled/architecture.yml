nodes:
- id: ddo_system
  dimension: System
  status: clean
  associated_file: spec/compiled/SuperPRD_v0.0.2_AdversarialLoop.md
  description: 'End-to-end DDO pipeline: Ingest \u2192 Render \u2192 Red Team \u2192 Interview \u2192 Refine.
    Transforms structured YAML into reproducible PDFs, HTML, and Markdown via a 5-phase,
    HITL-gated state machine with zero-hallucination guarantee. v0.0.2 complete: ddo.review
    data layer (structural contracts, atomic writes, _vN derivation, torn-pass detection),
    ddo.refine mutation layer (hand-rolled path DSL parser, constrained pure apply_patches,
    pre-refine snapshots, validate-before-write), three adversarial-loop skills (ddo-red-team,
    ddo-interview, ddo-refine). v0.0.5 adds optional meta.style_profile field with untrusted
    phrasing-only guidance scoped to content.sections[*].body, injected via ddo-ingest and
    ddo-interview, persisted in document_data.yaml but render-invisible.

    '
  inputs:
  - data_type: raw_source_documents
    source_id: external_sources
  outputs:
  - data_type: rendered_artifacts
    target_id: documents_output
  edges:
    depends_on: []
    implements: []
- id: ddo_core
  dimension: Module
  status: clean
  associated_file: ddo/
  description: "Core DDO Python package (ddo/). Seven core modules: build.py (hermetic\
    \ PEP 723 render orchestrator with CLI-authoritative --template/--format flags,\
    \ timeout/size guards, template/font resolution), validation.py (importable validation\
    \ gate: meta/evidence_bank contract, evidence integrity, sentinel detection), paths.py\
    \ (pure path sanitization and containment enforcement), ingest.py (atomic write +\
    \ crash-safe temp\u2192replace pipeline + fabrication tripwire), review.py (critique/interview\
    \ data layer: structural contracts, atomic + contained writes, deterministic view\
    \ generation, _vN derivation, torn-pass detection), refine.py (mutation layer: hand-rolled\
    \ path-DSL parser, constrained pure apply_patches, refine-only structural check,\
    \ pre-refine snapshots, validate-before-write commit). All rendering and adversarial-loop\
    \ mutations flow through this module; it enforces zero-hallucination and safety invariants.\n"
  inputs:
  - data_type: document_data_yaml
    source_id: documents_output
  - data_type: cli_args
    source_id: ddo_skills
  outputs:
  - data_type: rendered_artifacts
    target_id: documents_output
  - data_type: review_history_artifacts
    target_id: documents_output
  edges:
    depends_on:
    - ddo_templates
    - ddo_schemas
    implements:
    - ddo_system
- id: ddo_templates
  dimension: Module
  status: clean
  associated_file: ddo/templates/
  description: "Typst (.typst) and Jinja2 (.jinja2) rendering templates for each document-type\
    \ \xD7 format combination (prd/scientific_report \xD7 pdf/html/md). Templates\
    \ are resolved strictly from CLI flags by build.py, never from meta.\n"
  inputs:
  - data_type: document_data_yaml
    source_id: ddo_core
  outputs:
  - data_type: rendered_text_or_pdf
    target_id: ddo_core
  edges:
    depends_on: []
    implements:
    - ddo_system
- id: ddo_schemas
  dimension: Module
  status: clean
  associated_file: ddo/schemas/
  description: 'YAML schema definitions (prd.yaml, scientific_report.yaml) encoding
    the minimal contract every document_data.yaml must satisfy: a meta block and an
    evidence_bank array. Authoritative reference for ddo-ingest skill and validation
    gate. Both schemas include an optional meta.style_profile field (prd.yaml defaults
    to formal_professional, scientific_report.yaml defaults to technical_precise),
    placed immediately after persona, resolving to ddo/styles/<stem>.md; if absent,
    no style anchoring is applied. Field is render-invisible and validation.py (importable
    gate) ignores it.

    '
  inputs: []
  outputs:
  - data_type: schema_contract
    target_id: ddo_core
  edges:
    depends_on: []
    implements:
    - ddo_system
- id: ddo_personas
  dimension: Module
  status: clean
  associated_file: ddo/personas/
  description: 'Adversarial review lens definitions (product_critic.md, scientific_reviewer.md)
    used by the Red Team and Interview phases to critique rendered documents from
    domain-specific perspectives.

    '
  inputs: []
  outputs:
  - data_type: review_lens
    target_id: ddo_system
  edges:
    depends_on: []
    implements:
    - ddo_system
- id: ddo_skills
  dimension: Module
  status: clean
  associated_file: ddo/skills/
  description: 'Five HACF cognitive node skill definitions orchestrating the complete
    DDO pipeline: ddo-ingest.md (load source materials, derive meta, write document_data.yaml
    via ddo.ingest), ddo-render.md (invoke build.py with CLI-authoritative --template/--format
    flags), ddo-red-team.md (fresh-context adversarial critique against persona lens,
    version derivation, atomic report+view write via ddo.review), ddo-interview.md (paced
    batched Q&A resolving findings to interview_log_vN.yaml, mark findings decision_recorded),
    ddo-refine.md (snapshot source, apply validated patches, present Before/After diff
    for HITL approval, commit via ddo.refine, re-render, mark applied and append history).
    Skills delegate all deterministic safety mechanics (path derivation, validation, mutation,
    atomic writes) to ddo_core and never re-implement them. v0.0.5 adds style-profile
    injection to ddo-ingest.md and ddo-interview.md: stem-validates meta.style_profile
    (^[a-z][a-z0-9_]*$, re-validated on every read regardless of provenance), hard-fails
    on referenced-but-missing or present-but-invalid values, reads ddo/styles/<stem>.md
    as untrusted phrasing-only guidance scoped to content.sections[*].body only (never
    evidence_bank[*] or meta.*), routes would-be fabrications to [[DDO::REQUIRES_INPUT:
    ...]] and echoes resolved profile path.

    '
  inputs:
  - data_type: source_materials
    source_id: external_sources
  outputs:
  - data_type: document_data_yaml
    target_id: ddo_core
  - data_type: review_decisions
    target_id: ddo_core
  edges:
    depends_on:
    - ddo_core
    - ddo_schemas
    implements:
    - ddo_system
- id: tests_unit
  dimension: Module
  status: clean
  associated_file: tests/unit/
  description: "Unit test suite (tests/unit/) covering all DDO core modules. 8 test\
    \ files, 200+ tests, all pure (no subprocess, no filesystem mutations beyond tmp_path).\
    \ test_validation_gate.py: 25 tests covering meta/evidence_bank contract, ID uniqueness/integrity,\
    \ sentinel detection, orphan warnings. test_ingest_helpers.py: atomic_write overwrite\
    \ guard, crash-safety via temp\u2192replace, fabrication_tripwire token detection.\
    \ test_slug_containment.py: slug sanitization ([a-z0-9-] charset, 80-char cap,\
    \ [..] + separator prevention, PathContainmentError). test_personas.py: AV-NN ID format,\
    \ sequentiality, uniqueness, snake_case Names validation, sentinel-absence. test_styles.py:\
    \ (v0.0.5) title heading, five required ## section headings, non-empty bodies, sentinel-absence,\
    \ parametrized via glob. test_fixture_signoff_guard.py: pure functions fixtures_touched/is_signed_off/assert_fixture_signoff\
    \ isolated from git. test_review.py: 40+ tests of ddo.review \u2014 validate_report/validate_interview_log\
    \ contracts, _vN derivation (max+1, gap handling), torn-pass detection (report-without-log,\
    \ source-newer), write operations, flag updates (decision_recorded, applied),\
    \ history accumulation, deterministic view/history generation. test_refine.py:\
    \ 46+ tests of ddo.refine \u2014 parse_path DSL grammar validation, apply_patches\
    \ purity (no input mutation), constrained set (leaf-scalar only, no auto-vivify,\
    \ no type change), M3-M9 invariants (byte-unchanged-on-abort, validate-clean,\
    \ key-order preservation, corruption rejection, pre-refine snapshot rollback).\n"
  inputs: []
  outputs: []
  edges:
    depends_on:
    - ddo_core
    - scripts
    implements: []
- id: tests_integration
  dimension: Module
  status: clean
  associated_file: tests/integration/
  description: 'Integration test suite (tests/integration/) driving real end-to-end
    DDO pipeline execution via subprocess uv run; all human-gated via DDO_FIXTURE_SIGNOFF=1.
    test_render_determinism.py (M1-M3b): both example YAML files render to pdf/html/md
    with exit 0; HTML/MD outputs byte-identical across runs (normalized LF+strip);
    PDF text layer identical across wall-clock runs; --timestamp determinism (M3b:
    same timestamp yields byte-for-byte identical PDFs); optional golden regression
    baseline comparison (skips without sign-off). test_ingest_contract.py (M5): promoted
    fixture (tests/fixtures/ingest_output.yaml) passes validate() and renders all
    3 formats; skips gracefully until signed off; agents must never author this file.
    test_loop.py (M5 adversarial loop): human-gated end-to-end gap-closing pass with
    fixtures (document_data_with_gap.yaml, interview_log_v1.yaml) in tests/fixtures/loop/;
    asserts (M5.1) no [[DDO::REQUIRES_INPUT:]] sentinel in patched dict, (M5.2) committed
    YAML passes validate(), (M5.3) build.py renders all 3 formats with exit 0; does
    NOT assert semantic correctness (human responsibility).

    '
  inputs: []
  outputs: []
  edges:
    depends_on:
    - ddo_core
    - ddo_schemas
    implements: []
- id: scripts
  dimension: Module
  status: clean
  associated_file: scripts/
  description: 'Project utility and enforcement scripts. Currently contains fixture_signoff_guard.py
    which mechanically enforces the human-gated promotion of golden regression baselines
    (SuperPRD RT#13).

    '
  inputs: []
  outputs: []
  edges:
    depends_on: []
    implements: []
- id: documents_output
  dimension: Module
  status: clean
  associated_file: Documents/
  description: "Gitignored rendered-document output tree (version-controlled source\
    \ YAML only; artifacts auto-generated). Directory layout: Documents/YYYY.MM.DD_DocType_Title/.\
    \ Each document folder contains: (1) document_data.yaml \u2014 the mutable source\
    \ of truth in YAML, authored by ddo-ingest, mutated by ddo-refine; (2) output/\
    \ subfolder \u2014 rendered artifacts (pdf, html, md files), generated by build.py\
    \ and wiped on each render; (3) review_history/ subfolder \u2014 versioned adversarial-loop\
    \ artifacts (atomic writes via ddo.review): red_team_report_vN.yaml (machine-readable\
    \ findings), red_team_view_vN.md (code-generated human view, never re-parsed),\
    \ interview_log_vN.yaml (resolutions with patches), document_data_pre_vN.yaml\
    \ (byte-for-byte snapshots before each refine), history.yaml (consolidated pass\
    \ records), history.md (code-generated view). All paths derived and containment-checked\
    \ by ddo.paths.assert_within_documents before any write.\n"
  inputs:
  - data_type: rendered_artifacts
    source_id: ddo_core
  - data_type: review_history_artifacts
    source_id: review_engine
  outputs: []
  edges:
    depends_on:
    - ddo_core
    implements:
    - ddo_system
- id: build_orchestrator
  dimension: Atomic
  status: clean
  associated_file: ddo/build.py
  description: 'PEP 723 hermetic entry point (``uv run --locked ddo/build.py``). Parses
    CLI flags, loads YAML via yaml.safe_load, delegates validation to validation_gate,
    resolves templates strictly from --template/--format (never meta), dispatches
    to _render_typst (PDF) or _render_jinja (HTML/MD) under a 30s wall-clock timeout
    and 64 MiB output-size cap via a daemon thread guard.

    '
  inputs:
  - data_type: cli_args
    source_id: external_cli
  - data_type: document_data_yaml
    source_id: documents_output
  outputs:
  - data_type: rendered_artifacts
    target_id: documents_output
  edges:
    depends_on:
    - validation_gate
    - ddo_templates
    implements:
    - ddo_core
- id: validation_gate
  dimension: Atomic
  status: clean
  associated_file: ddo/validation.py
  description: 'Importable validation gate called directly by build.py and the v0.0.2
    loop. Three ordered checks: (1) structural meta/evidence_bank contract; (2) evidence-bank
    uniqueness and reference integrity (orphans warn, not fail); (3) recursive sentinel
    scan for [[DDO::REQUIRES_INPUT:. Raises ValidationError on the first failure,
    naming the offending field or ID.

    '
  inputs:
  - data_type: parsed_document_dict
    source_id: build_orchestrator
  outputs:
  - data_type: validation_result_or_exception
    target_id: build_orchestrator
  edges:
    depends_on: []
    implements:
    - ddo_core
- id: path_deriver
  dimension: Atomic
  status: clean
  associated_file: ddo/paths.py
  description: 'Pure, side-effect-free path helpers. sanitize_slug collapses input
    to [a-z0-9-] (structurally forbids ``..`` and path separators). document_dir computes
    Documents/<date>_<doc_type>_<slug>/. assert_within_documents resolves realpath
    and raises PathContainmentError if the path escapes Documents/. Imported by ingest_helpers;
    never re-implemented elsewhere.

    '
  inputs:
  - data_type: meta_block
    source_id: ddo_skills
  outputs:
  - data_type: safe_contained_path
    target_id: ingest_helpers
  edges:
    depends_on: []
    implements:
    - ddo_core
- id: ingest_helpers
  dimension: Atomic
  status: clean
  associated_file: ddo/ingest.py
  description: "Safety-critical write mechanics for the ddo-ingest skill. atomic_write\
    \ enforces the overwrite guard (OverwriteError if target exists and force=False)\
    \ and a crash-safe temp\u2192os.replace pipeline. fabrication_tripwire surfaces\
    \ date/number/ proper-noun tokens absent from sources (advisory, never raises).\
    \ document_data_path composes the containment-checked target path.\n"
  inputs:
  - data_type: yaml_text_and_source_texts
    source_id: ddo_skills
  outputs:
  - data_type: document_data_yaml
    target_id: documents_output
  edges:
    depends_on:
    - path_deriver
    implements:
    - ddo_core
- id: fixture_signoff_guard
  dimension: Atomic
  status: clean
  associated_file: scripts/fixture_signoff_guard.py
  description: 'Pre-commit/CI guard enforcing SuperPRD RT#13: rejects staged changes
    to tests/fixtures/ unless DDO_FIXTURE_SIGNOFF=1 is set in the environment. Pure
    functions (fixtures_touched, is_signed_off, assert_fixture_signoff) are unit-testable
    without git. Wired via ``python scripts/fixture_signoff_guard.py``.

    '
  inputs:
  - data_type: staged_file_list
    source_id: git_hook
  outputs:
  - data_type: exit_code
    target_id: git_hook
  edges:
    depends_on: []
    implements:
    - scripts
