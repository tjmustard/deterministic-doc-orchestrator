    \ asserts (M5.1) no [[DDO::REQUIRES_INPUT:]] sentinel in patched dict, (M5.2) committed\
    \ YAML passes validate(), (M5.3) build.py renders all 3 formats with exit 0; does\
    \ NOT assert semantic correctness (human responsibility).\n"
  inputs: []
  outputs: []
