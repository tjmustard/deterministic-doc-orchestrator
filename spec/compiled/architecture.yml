- id: review_engine
  dimension: Atomic
  status: dirty
  associated_file: ddo/review.py
  description: 'Critique/interview data layer for the DDO adversarial loop (ddo.review).
    Structural validation: validate_report and validate_interview_log enforce fixed
    enums (severity, decision) and required fields (M1). Version derivation: report_version
    returns max(existing N)+1, current_version returns max N or None (M2). Torn-pass
    detection: flags report-without-log and source-newer-than-history. Write operations:
    write_report and write_interview_log delegate to atomic_write with sort_keys=False.
    View generation: render_report_view and render_history_view produce byte-deterministic
    Markdown from stored YAML. Flag updates: mark_findings sets decision_recorded
    or applied on specific findings and regenerates the view. History tracking: append_history
    accumulates pass records and flags phantom entries when artifacts are missing.

    '
  inputs:
  - data_type: red_team_report_yaml
    source_id: skill_red_team
  - data_type: interview_log_yaml
    source_id: skill_interview
  outputs:
  - data_type: review_history_artifacts
    target_id: documents_output
  edges:
    depends_on:
    - ingest_helpers
    - path_deriver
    - validation_gate
    implements:
    - ddo_core
- id: refine_engine
  dimension: Atomic
  status: dirty
  associated_file: ddo/refine.py
  description: 'Mutation layer for the DDO adversarial loop (ddo.refine). Parse layer:
    parse_path hand-rolls a dot/bracket DSL (never eval/exec) into a list of keys/indices.
    Apply layer: apply_patches is pure (no I/O, deep copy only), applies set/append_evidence/append_review_log
    operations with strict validation (leaf-scalar only, no auto-vivify, no type change,
    no wholesale section replacement). Structural guard: refine_structural_check validates
    meta/content remain dicts, sections remains a list, bodies remain non-empty strings
    (D5 preserved). Snapshot: snapshot_source copies document_data.yaml byte-for-byte
    to document_data_pre_vN.yaml before mutation (RT#2/M9). Commit: commit_refine
    double-checks with refine_structural_check + validate in-memory, then serializes
    with sort_keys=False and atomic_writes to Documents/ (RT#3).

    '
  inputs:
  - data_type: interview_log_yaml
    source_id: skill_interview
  - data_type: document_data_yaml
    source_id: documents_output
  outputs:
  - data_type: document_data_yaml
    target_id: documents_output
  edges:
    depends_on:
    - ingest_helpers
    - path_deriver
    - validation_gate
    - review_engine
    implements:
    - ddo_core
- id: skill_red_team
  dimension: Atomic
  status: clean
  associated_file: ddo/skills/ddo-red-team.md
  description: 'HACF cognitive node for the Red Team phase of the adversarial loop.
    Mandatory fresh-context firewall: does not inherit authoring/ingest/render history;
    only handoff is path to rendered MD/HTML. (1) Detects torn-pass via review.detect_incomplete_pass
    and halts if prior pass incomplete. (2) Derives version via review.report_version
    (max existing N + 1; 1 if none). (3) Resolves persona from meta.persona (loaded
    from document_data.yaml) or explicit CLI argument; hard-fails (names missing file,
    lists available personas) if file not found. (4) Reads rendered MD/HTML file (never
    PDF; parses HTML for text-layer content if needed). (5) Applies persona attack-vector
    taxonomy, generates findings with id, severity (fixed enum: Critical|Major|Minor),
    category (free-text), location, description, suggestion. (6) Writes red_team_report_vN.yaml
    (machine-readable) and deterministic red_team_view_vN.md (code-generated Markdown,
    human-only, never re-parsed) via review.write_report. (7) Soft-warns if findings
    > 100 (advisory cap). Halts at [WAITING FOR USER REVIEW] and instructs fresh context
    before ddo-interview.

    '
  inputs:
  - data_type: rendered_markdown
    source_id: build_orchestrator
  - data_type: persona_lens
    source_id: ddo_personas
  outputs:
  - data_type: red_team_report_yaml
    target_id: review_engine
  edges:
    depends_on:
    - review_engine
    - ddo_personas
    implements:
    - ddo_skills
- id: skill_interview
  dimension: Atomic
  status: dirty
  associated_file: ddo/skills/ddo-interview.md
  description: "HACF cognitive node for the Interview phase of the adversarial loop.\
    \ Loads red_team_report_vN.yaml (machine-readable), filters applied:false findings,\
    \ sorts by severity (Critical \u2192 Major \u2192 Minor). Presents findings in\
    \ batches (default 2 per turn). For each finding, user selects revise|add_evidence|acknowledge|dispute|defer.\
    \ For patch-producing decisions (revise/add_evidence), constructs patch operations\
    \ (set/append_evidence/append_review_log) with path DSL targets. For non-patch\
    \ decisions, sets patch=null. Writes interview_log_vN.yaml via review.write_interview_log.\
    \ Marks resolved findings decision_recorded:true in the report via review.mark_findings.\
    \ Halts at HITL gate [WAITING FOR USER RESPONSE].\n"
  inputs:
  - data_type: red_team_report_yaml
    source_id: review_engine
  - data_type: document_data_yaml
    source_id: documents_output
  outputs:
  - data_type: interview_log_yaml
    target_id: review_engine
  edges:
    depends_on:
    - review_engine
    implements:
    - ddo_skills
- id: skill_refine
  dimension: Atomic
  status: dirty
  associated_file: ddo/skills/ddo-refine.md
  description: 'HACF cognitive node for the Refine phase of the adversarial loop.
    Detects torn-pass via review.detect_incomplete_pass. Loads document_data.yaml
    and interview_log_vN.yaml, filters unapplied resolutions with patches. Takes pre-refine
    snapshot via refine.snapshot_source. Applies patches (pure) via refine.apply_patches,
    validates in-memory (refine_structural_check + validate). Generates before/after
    diff for user approval (HITL gate). On approval, commits via refine.commit_refine,
    re-renders via ddo-render. Marks findings applied:true and appends history record
    ONLY after both commit and render succeed (flag split invariant). Halts at HITL
    gate [WAITING FOR USER RESPONSE].

    '
  inputs:
  - data_type: interview_log_yaml
    source_id: review_engine
  - data_type: document_data_yaml
    source_id: documents_output
  outputs:
  - data_type: document_data_yaml
    target_id: documents_output
  - data_type: review_history_artifacts
    target_id: review_engine
  edges:
    depends_on:
    - refine_engine
    - review_engine
    implements:
    - ddo_skills
- id: test_review_unit
  dimension: Atomic
  status: dirty
  associated_file: tests/unit/test_review.py
  description: 'Unit tests for ddo.review covering structural validation (M1): validate_report
    and validate_interview_log pass/fail paths, severity and decision enums, soft
    cap warning on >100 findings. Version derivation (M2): report_version (max+1,
    handles gaps), current_version (max or None). Torn-pass detection: report-without-log,
    source-newer-than-history. Write operations: write_report (creates YAML + view),
