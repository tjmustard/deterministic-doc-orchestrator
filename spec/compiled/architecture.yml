- id: skill_refine
  dimension: Atomic
  status: clean
  associated_file: ddo/skills/ddo-refine.md
  description: 'HACF cognitive node for the Refine phase of the adversarial loop.
    Detects torn-pass via review.detect_incomplete_pass. Loads document_data.yaml
    and interview_log_vN.yaml, filters unapplied resolutions with patches. Takes pre-refine
    snapshot via refine.snapshot_source. Applies patches (pure) via refine.apply_patches,
    validates in-memory (refine_structural_check + validate). Generates before/after
    diff for user approval (HITL gate). On approval, commits via refine.commit_refine,
    re-renders via ddo-render. Marks findings applied:true and appends history record
    ONLY after both commit and render succeed (flag split invariant). Halts at HITL
    gate [WAITING FOR USER RESPONSE].

    '
  inputs:
  - data_type: interview_log_yaml
    source_id: review_engine
  - data_type: document_data_yaml
    source_id: documents_output
  outputs:
  - data_type: document_data_yaml
    target_id: documents_output
  - data_type: review_history_artifacts
    target_id: review_engine
  edges:
    depends_on:
    - refine_engine
    - review_engine
    implements:
    - ddo_skills
