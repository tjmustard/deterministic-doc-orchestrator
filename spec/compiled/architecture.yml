- id: documents_output
  dimension: Module
  status: clean
  associated_file: Documents/
  description: "Gitignored rendered-document output tree (version-controlled source\
    \ YAML only; artifacts auto-generated). Directory layout: Documents/YYYY.MM.DD_DocType_Title/.\
    \ Each document folder contains: (1) document_data.yaml \u2014 the mutable source\
    \ of truth in YAML, authored by ddo-ingest, mutated by ddo-refine, includes optional\
    \ meta.style_profile field (render-invisible, phrasing-only guidance); (2) output/\
    \ subfolder \u2014 rendered artifacts (pdf, html, md files), generated by build.py\
    \ and wiped on each render; (3) review_history/ subfolder \u2014 versioned adversarial-loop\
    \ artifacts (atomic writes via ddo.review): red_team_report_vN.yaml (machine-readable\
    \ findings), red_team_view_vN.md (code-generated human view, never re-parsed),\
    \ interview_log_vN.yaml (resolutions with patches), document_data_pre_vN.yaml\
    \ (byte-for-byte snapshots before each refine), history.yaml (consolidated pass\
    \ records), history.md (code-generated view). All paths derived and containment-checked\
    \ by ddo.paths.assert_within_documents before any write. v0.0.6: supports four\
    \ new document types (blog_post, meeting_notes, meeting_agenda, project_report)\
    \ and their associated personas and style profiles.\n"
  inputs:
  - data_type: rendered_artifacts
    source_id: ddo_core
  - data_type: review_history_artifacts
    source_id: review_engine
  outputs: []
  edges:
    depends_on:
    - ddo_core
    implements:
    - ddo_system
- id: build_orchestrator
  dimension: Atomic
  status: dirty
  associated_file: ddo/build.py
  description: 'PEP 723 hermetic entry point (``uv run --locked ddo/build.py``). Parses
    CLI flags, loads YAML via yaml.safe_load, delegates validation to validation_gate,
    resolves templates strictly from --template/--format (never meta), dispatches
    to _render_typst (PDF) or _render_jinja (HTML/MD) under a 30s wall-clock timeout
    and 64 MiB output-size cap via a daemon thread guard.

    '
  inputs:
  - data_type: cli_args
    source_id: external_cli
  - data_type: document_data_yaml
    source_id: documents_output
  outputs:
  - data_type: rendered_artifacts
    target_id: documents_output
  edges:
    depends_on:
    - validation_gate
    - ddo_templates
    implements:
    - ddo_core
- id: validation_gate
  dimension: Atomic
  status: clean
  associated_file: ddo/validation.py
  description: 'Importable validation gate called directly by build.py and the v0.0.2
    loop. Three ordered checks: (1) structural meta/evidence_bank contract; (2) evidence-bank
    uniqueness and reference integrity (orphans warn, not fail); (3) recursive sentinel
    scan for [[DDO::REQUIRES_INPUT:. Raises ValidationError on the first failure,
    naming the offending field or ID.

    '
  inputs:
  - data_type: parsed_document_dict
    source_id: build_orchestrator
  outputs:
  - data_type: validation_result_or_exception
    target_id: build_orchestrator
  edges:
    depends_on: []
    implements:
    - ddo_core
- id: path_deriver
  dimension: Atomic
  status: clean
  associated_file: ddo/paths.py
  description: 'Pure, side-effect-free path helpers. sanitize_slug collapses input
    to [a-z0-9-] (structurally forbids ``..`` and path separators). document_dir computes
    Documents/<date>_<doc_type>_<slug>/. assert_within_documents resolves realpath
    and raises PathContainmentError if the path escapes Documents/. Imported by ingest_helpers;
    never re-implemented elsewhere.

    '
  inputs:
  - data_type: meta_block
    source_id: ddo_skills
  outputs:
  - data_type: safe_contained_path
    target_id: ingest_helpers
  edges:
    depends_on: []
    implements:
    - ddo_core
- id: ingest_helpers
  dimension: Atomic
  status: clean
  associated_file: ddo/ingest.py
  description: "Safety-critical write mechanics for the ddo-ingest skill. atomic_write\
    \ enforces the overwrite guard (OverwriteError if target exists and force=False)\
    \ and a crash-safe temp\u2192os.replace pipeline. fabrication_tripwire surfaces\
    \ date/number/ proper-noun tokens absent from sources (advisory, never raises).\
    \ document_data_path composes the containment-checked target path.\n"
  inputs:
  - data_type: yaml_text_and_source_texts
    source_id: ddo_skills
  outputs:
  - data_type: document_data_yaml
    target_id: documents_output
  edges:
    depends_on:
    - path_deriver
    implements:
    - ddo_core
- id: fixture_signoff_guard
  dimension: Atomic
  status: clean
  associated_file: scripts/fixture_signoff_guard.py
  description: 'Pre-commit/CI guard enforcing SuperPRD RT#13: rejects staged changes
    to tests/fixtures/ unless DDO_FIXTURE_SIGNOFF=1 is set in the environment. Pure
    functions (fixtures_touched, is_signed_off, assert_fixture_signoff) are unit-testable
    without git. Wired via ``python scripts/fixture_signoff_guard.py``.

    '
  inputs:
  - data_type: staged_file_list
    source_id: git_hook
  outputs:
  - data_type: exit_code
    target_id: git_hook
  edges:
    depends_on: []
    implements:
    - scripts
