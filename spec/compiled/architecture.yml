# architecture.yml — DDO Hypergraph
# Generated by /hyper-discover on 2026-06-29.
# Schema: .agents/schemas/hypergraph_schema.md (migrated to CLAUDE.md › Schema Definitions).
# Maintenance: after modifying a node run
#   python .agents/scripts/hypergraph_updater.py spec/compiled/architecture.yml <node_id>

nodes:

  # =========================================================================
  # SYSTEM NODE
  # =========================================================================

  - id: ddo_system
    dimension: System
    status: clean
    associated_file: spec/compiled/SuperPRD.md
    description: >
      End-to-end DDO pipeline: Ingest → Render → Red Team → Interview → Refine.
      Transforms structured YAML into reproducible PDFs, HTML, and Markdown via a
      5-phase, HITL-gated state machine with a zero-hallucination constraint.
    inputs:
      - data_type: raw_source_documents
        source_id: external_sources
    outputs:
      - data_type: rendered_artifacts
        target_id: documents_output
    edges:
      depends_on: []
      implements: []

  # =========================================================================
  # MODULE NODES
  # =========================================================================

  - id: ddo_core
    dimension: Module
    status: clean
    associated_file: spec/compiled/MiniPRD_BuildCore.md
    description: >
      Core DDO Python package (ddo/). Owns the hermetic render orchestrator
      (build.py), the importable validation gate (validation.py), the pure
      path-derivation helpers (paths.py), and the ingest safety mechanics
      (ingest.py). All document rendering is gated through this module.
    inputs:
      - data_type: document_data_yaml
        source_id: documents_output
      - data_type: cli_args
        source_id: ddo_skills
    outputs:
      - data_type: rendered_artifacts
        target_id: documents_output
    edges:
      depends_on: [ddo_templates, ddo_schemas]
      implements: [ddo_system]

  - id: ddo_templates
    dimension: Module
    status: clean
    associated_file: ddo/templates/
    description: >
      Typst (.typst) and Jinja2 (.jinja2) rendering templates for each
      document-type × format combination (prd/scientific_report × pdf/html/md).
      Templates are resolved strictly from CLI flags by build.py, never from meta.
    inputs:
      - data_type: document_data_yaml
        source_id: ddo_core
    outputs:
      - data_type: rendered_text_or_pdf
        target_id: ddo_core
    edges:
      depends_on: []
      implements: [ddo_system]

  - id: ddo_schemas
    dimension: Module
    status: clean
    associated_file: ddo/schemas/
    description: >
      YAML schema definitions (prd.yaml, scientific_report.yaml) encoding the
      minimal contract every document_data.yaml must satisfy: a meta block and an
      evidence_bank array. Authoritative reference for the ddo-ingest skill and
      the validation gate.
    inputs: []
    outputs:
      - data_type: schema_contract
        target_id: ddo_core
    edges:
      depends_on: []
      implements: [ddo_system]

  - id: ddo_personas
    dimension: Module
    status: clean
    associated_file: ddo/personas/
    description: >
      Adversarial review lens definitions (product_critic.md, scientific_reviewer.md)
      used by the Red Team and Interview phases to critique rendered documents
      from domain-specific perspectives.
    inputs: []
    outputs:
      - data_type: review_lens
        target_id: ddo_system
    edges:
      depends_on: []
      implements: [ddo_system]

  - id: ddo_skills
    dimension: Module
    status: clean
    associated_file: ddo/skills/
    description: >
      DDO cognitive node skill definitions (ddo-ingest.md, ddo-render.md) that
      direct agent execution of the Ingest and Render pipeline phases. The skills
      delegate all deterministic safety mechanics to ddo_core and never re-implement
      path or validation logic.
    inputs:
      - data_type: source_materials
        source_id: external_sources
    outputs:
      - data_type: document_data_yaml
        target_id: ddo_core
    edges:
      depends_on: [ddo_core, ddo_schemas]
      implements: [ddo_system]

  - id: tests_unit
    dimension: Module
    status: clean
    associated_file: spec/compiled/MiniPRD_TestSuite.md
    description: >
      Unit test suite (tests/unit/) covering the validation gate, ingest helpers,
      path slug containment, persona file structure, and fixture signoff guard.
      All unit tests are pure (no subprocess, no filesystem side-effects).
    inputs: []
    outputs: []
    edges:
      depends_on: [ddo_core, scripts]
      implements: []

  - id: tests_integration
    dimension: Module
    status: clean
    associated_file: spec/compiled/MiniPRD_TestSuite.md
    description: >
      Integration test suite (tests/integration/) driving the real build.py via
      ``uv run --locked`` to assert render determinism (M1-M3b) and ingest
      contract validity (M5). Human-gated golden regression skips until sign-off.
    inputs: []
    outputs: []
    edges:
      depends_on: [ddo_core, ddo_schemas]
      implements: []

  - id: scripts
    dimension: Module
    status: clean
    associated_file: scripts/
    description: >
      Project utility and enforcement scripts. Currently contains
      fixture_signoff_guard.py which mechanically enforces the human-gated
      promotion of golden regression baselines (SuperPRD RT#13).
    inputs: []
    outputs: []
    edges:
      depends_on: []
      implements: []

  - id: documents_output
    dimension: Module
    status: clean
    associated_file: Documents/
    description: >
      Gitignored rendered-document output tree. Layout:
      Documents/YYYY.MM.DD_DocType_Title/. Each folder holds document_data.yaml
      (the version-controlled source of truth) and output/<slug>.<ext> artifacts.
      Paths are derived and containment-checked by ddo.paths before any write.
    inputs:
      - data_type: rendered_artifacts
        source_id: ddo_core
    outputs: []
    edges:
      depends_on: [ddo_core]
      implements: [ddo_system]

  # =========================================================================
  # ATOMIC NODES — ddo/ package
  # =========================================================================

  - id: build_orchestrator
    dimension: Atomic
    status: clean
    associated_file: ddo/build.py
    description: >
      PEP 723 hermetic entry point (``uv run --locked ddo/build.py``). Parses CLI
      flags, loads YAML via yaml.safe_load, delegates validation to validation_gate,
      resolves templates strictly from --template/--format (never meta), dispatches
      to _render_typst (PDF) or _render_jinja (HTML/MD) under a 30s wall-clock
      timeout and 64 MiB output-size cap via a daemon thread guard.
    inputs:
      - data_type: cli_args
        source_id: external_cli
      - data_type: document_data_yaml
        source_id: documents_output
    outputs:
      - data_type: rendered_artifacts
        target_id: documents_output
    edges:
      depends_on: [validation_gate, ddo_templates]
      implements: [ddo_core]

  - id: validation_gate
    dimension: Atomic
    status: clean
    associated_file: ddo/validation.py
    description: >
      Importable validation gate called directly by build.py and the v0.0.2 loop.
      Three ordered checks: (1) structural meta/evidence_bank contract;
      (2) evidence-bank uniqueness and reference integrity (orphans warn, not fail);
      (3) recursive sentinel scan for [[DDO::REQUIRES_INPUT:. Raises ValidationError
      on the first failure, naming the offending field or ID.
    inputs:
      - data_type: parsed_document_dict
        source_id: build_orchestrator
    outputs:
      - data_type: validation_result_or_exception
        target_id: build_orchestrator
    edges:
      depends_on: []
      implements: [ddo_core]

  - id: path_deriver
    dimension: Atomic
    status: clean
    associated_file: ddo/paths.py
    description: >
      Pure, side-effect-free path helpers. sanitize_slug collapses input to
      [a-z0-9-] (structurally forbids ``..`` and path separators). document_dir
      computes Documents/<date>_<doc_type>_<slug>/. assert_within_documents resolves
      realpath and raises PathContainmentError if the path escapes Documents/.
      Imported by ingest_helpers; never re-implemented elsewhere.
    inputs:
      - data_type: meta_block
        source_id: ddo_skills
    outputs:
      - data_type: safe_contained_path
        target_id: ingest_helpers
    edges:
      depends_on: []
      implements: [ddo_core]

  - id: ingest_helpers
    dimension: Atomic
    status: clean
    associated_file: ddo/ingest.py
    description: >
      Safety-critical write mechanics for the ddo-ingest skill. atomic_write enforces
      the overwrite guard (OverwriteError if target exists and force=False) and a
      crash-safe temp→os.replace pipeline. fabrication_tripwire surfaces date/number/
      proper-noun tokens absent from sources (advisory, never raises). document_data_path
      composes the containment-checked target path.
    inputs:
      - data_type: yaml_text_and_source_texts
        source_id: ddo_skills
    outputs:
      - data_type: document_data_yaml
        target_id: documents_output
    edges:
      depends_on: [path_deriver]
      implements: [ddo_core]

  # =========================================================================
  # ATOMIC NODES — scripts/
  # =========================================================================

  - id: fixture_signoff_guard
    dimension: Atomic
    status: clean
    associated_file: scripts/fixture_signoff_guard.py
    description: >
      Pre-commit/CI guard enforcing SuperPRD RT#13: rejects staged changes to
      tests/fixtures/ unless DDO_FIXTURE_SIGNOFF=1 is set in the environment.
      Pure functions (fixtures_touched, is_signed_off, assert_fixture_signoff) are
      unit-testable without git. Wired via ``python scripts/fixture_signoff_guard.py``.
    inputs:
      - data_type: staged_file_list
        source_id: git_hook
    outputs:
      - data_type: exit_code
        target_id: git_hook
    edges:
      depends_on: []
      implements: [scripts]

  # =========================================================================
  # ATOMIC NODES — tests/integration/
  # =========================================================================

  - id: render_fixture
    dimension: Atomic
    status: clean
    associated_file: tests/integration/conftest.py
    description: >
      Shared pytest session fixtures for the integration suite. repo_root resolves
      the repository root; example_path maps basenames to tests/data/; render wraps
      ``uv run --locked ddo/build.py`` as a subprocess, returning CompletedProcess
      so tests inspect exit code and stderr directly.
    inputs: []
    outputs:
      - data_type: subprocess_result
        target_id: test_render_determinism
    edges:
      depends_on: [build_orchestrator]
      implements: [tests_integration]

  - id: test_render_determinism
    dimension: Atomic
    status: clean
    associated_file: tests/integration/test_render_determinism.py
    description: >
      M1-M3b integration tests. M1: both examples render to pdf/html/md with exit 0.
      M2: HTML/MD outputs are byte-identical across runs (normalized LF+strip).
      M3: PDF text layer is identical across wall-clock runs. M3b: same --timestamp
      yields byte-for-byte identical PDFs. Optional golden regression skips until
      a human promotes baselines into tests/fixtures/.
    inputs:
      - data_type: subprocess_result
        source_id: render_fixture
    outputs: []
    edges:
      depends_on: [render_fixture, ddo_schemas]
      implements: [tests_integration]

  - id: test_ingest_contract
    dimension: Atomic
    status: clean
    associated_file: tests/integration/test_ingest_contract.py
    description: >
      M5 integration test. Asserts a human-promoted ingest fixture
      (tests/fixtures/ingest_output.yaml) passes validate() and renders all 3
      formats. Skips gracefully until DDO_FIXTURE_SIGNOFF=1 promotes the fixture;
      agents must never fabricate this file.
    inputs:
      - data_type: promoted_ingest_fixture
        source_id: documents_output
    outputs: []
    edges:
      depends_on: [validation_gate, render_fixture]
      implements: [tests_integration]

  # =========================================================================
  # ATOMIC NODES — tests/unit/
  # =========================================================================

  - id: test_validation_unit
    dimension: Atomic
    status: clean
    associated_file: tests/unit/test_validation_gate.py
    description: >
      25 unit tests for ddo.validation. Covers all pass/fail/warn paths: missing
      meta, malformed date, duplicate/dangling evidence IDs, contentless documents,
      sentinel detection, mutation safety, and ordering guarantee (contract before
      evidence).
    inputs: []
    outputs: []
    edges:
      depends_on: [validation_gate]
      implements: [tests_unit]

  - id: test_fixture_guard_unit
    dimension: Atomic
    status: clean
    associated_file: tests/unit/test_fixture_signoff_guard.py
    description: >
      Unit tests for scripts/fixture_signoff_guard.py covering the pure functions
      fixtures_touched, is_signed_off, and assert_fixture_signoff in isolation from
      the git subprocess.
    inputs: []
    outputs: []
    edges:
      depends_on: [fixture_signoff_guard]
      implements: [tests_unit]

  - id: test_ingest_helpers_unit
    dimension: Atomic
    status: clean
    associated_file: tests/unit/test_ingest_helpers.py
    description: >
      Unit tests for ddo.ingest covering atomic_write overwrite guard (OverwriteError
      on existing target without force), crash-safety via temp→replace, and
      fabrication_tripwire token detection across date/number/proper-noun classes.
    inputs: []
    outputs: []
    edges:
      depends_on: [ingest_helpers]
      implements: [tests_unit]

  - id: test_personas_unit
    dimension: Atomic
    status: clean
    associated_file: tests/unit/test_personas.py
    description: >
      Unit tests verifying the persona Markdown files (product_critic.md,
      scientific_reviewer.md) exist and contain the required review lens structure
      so the Red Team phase has valid adversarial lenses available.
    inputs: []
    outputs: []
    edges:
      depends_on: [ddo_personas]
      implements: [tests_unit]

  - id: test_slug_containment_unit
    dimension: Atomic
    status: clean
    associated_file: tests/unit/test_slug_containment.py
    description: >
      Unit tests for ddo.paths.sanitize_slug and assert_within_documents. Validates
      [a-z0-9-] charset enforcement, ``..`` and path-separator prevention, 80-char
      cap, fallback for degenerate input, and PathContainmentError on traversal
      attempts.
    inputs: []
    outputs: []
    edges:
      depends_on: [path_deriver]
      implements: [tests_unit]
