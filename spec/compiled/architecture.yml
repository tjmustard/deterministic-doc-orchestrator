- id: test_ingest_contract
  dimension: Atomic
  status: clean
  associated_file: tests/integration/test_ingest_contract.py
  description: 'M5 integration test. Asserts a human-promoted ingest fixture (tests/fixtures/ingest_output.yaml)
    passes validate() and renders all 3 formats. Skips gracefully until DDO_FIXTURE_SIGNOFF=1
    promotes the fixture; agents must never fabricate this file.

    '
  inputs:
  - data_type: promoted_ingest_fixture
    source_id: documents_output
  outputs: []
  edges:
