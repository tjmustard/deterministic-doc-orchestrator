# Example scientific_report document_data.yaml — test INPUT (not a human-gated fixture).
# Satisfies the DDO minimal contract and passes ddo.validation.validate().
meta:
  doc_type: "scientific_report"
  title: "Thermal Drift in Low-Cost Widget Strain Sensors"
  version: "1.0.0"
  date: "2026.06.27"
  authors:
    - "R. Okafor, Materials Lab"
    - "L. Petrova, Materials Lab"
  corresponding_author: "r.okafor@example.org"
  abstract: >-
    Low-cost resistive strain sensors are attractive for high-volume widget
    monitoring but their accuracy under temperature swings is poorly
    characterized. We measured drift across a 10 to 60 degree Celsius range for
    a batch of forty sensors and fit a linear compensation model. The model
    reduced mean absolute error substantially, suggesting inexpensive sensors
    are viable when paired with a software correction.
  keywords:
    - "strain sensing"
    - "thermal drift"
    - "calibration"
  status: "draft"
  persona: "scientific_reviewer"
  output_formats: ["pdf", "html", "md"]
  template: "scientific_report"

content:
  sections:
    - id: "introduction"
      title: "1. Introduction"
      body: >-
        Resistive strain sensors are widely deployed for structural monitoring,
        yet thermal sensitivity limits their use in uncontrolled environments.
        Prior work characterized drift for laboratory-grade devices but not for
        the low-cost units common in high-volume deployments.
      claims:
        - "Thermal drift in low-cost strain sensors is under-characterized."
      evidence: ["prior_calibration_study"]

    - id: "methods"
      title: "2. Materials and Methods"
      body: >-
        Forty sensors were mounted on a reference beam and cycled across 10 to
        60 degrees Celsius in a controlled chamber. Resistance was logged at one
        Hertz and paired with a calibrated thermocouple reading.
      claims: []
      evidence: ["chamber_protocol"]

    - id: "results"
      title: "3. Results"
      body: >-
        Uncompensated readings drifted with temperature in an approximately
        linear fashion across the tested range. A per-sensor linear correction
        reduced the mean absolute error by a large margin.
      claims:
        - "Drift was approximately linear across the tested range."
      evidence: ["drift_dataset"]

    - id: "discussion"
      title: "4. Discussion"
      body: >-
        The linearity of the observed drift makes a lightweight software
        correction practical on constrained hardware. Limitations include the
        single beam geometry and the bounded temperature range.
      claims: []
      evidence: ["drift_dataset"]

    - id: "conclusion"
      title: "5. Conclusion"
      body: >-
        Low-cost strain sensors are viable for widget monitoring when paired
        with a per-sensor linear thermal correction derived from a short
        calibration sweep.
      claims: []
      evidence: ["drift_dataset"]

evidence_bank:
  - id: "prior_calibration_study"
    type: "citation"
    content: "Nguyen, T. (2024). Thermal Compensation of Resistive Strain Gauges. Journal of Sensor Engineering, 12(3)."
    source: "DOI:10.0000/jse.2024.0123"
  - id: "chamber_protocol"
    type: "method"
    content: "Environmental chamber sweep protocol: 10 to 60 C, 5 C steps, 10 minute soak per step, 1 Hz logging."
    source: "Lab protocol document MP-2026-014."
  - id: "drift_dataset"
    type: "data"
    content: "Raw resistance and thermocouple time series for forty sensors across the full sweep."
    source: "lab-repo/data/strain_thermal_sweep_2026.csv"
