    type: "status_update"
    content: >-
      Milestone board export, 2026.06.28: Milestones 1-3 closed (schema parity audit,
      dual-write shim, data migration dry run); Milestone 4 (cutover rehearsal) 3 of 5
      steps complete; Milestone 5 (decommission) not started, blocked on Milestone 4.
    source: "Atlas Platform Migration status notes, tracking board export 2026.06.28."
  - id: "metrics_dashboard_export"
    type: "data"
    content: >-
      Metrics dashboard export, 2026.06.28: 0 write divergences across 18 days of
      dual-write; dry-run migrated 2.3 TB in 6h40m against an 8-hour target; 1
      migration-attributable on-call incident (40 minute resolution); 3 of 3 completed
      rehearsal steps passed on first attempt.
    source: "Atlas Platform Migration on-call metrics dashboard, 2026.06.28."
  - id: "risk_log_20260628"
    type: "status_update"
    content: >-
      Open risk log, 2026.06.28: R-1 vendor SLA countersignature delayed by legal review
      (flagged 2026.06.20); R-2 shadow-test on-call engineer allocated to an unrelated
      rotation through 2026.07.03; R-3 rollback drill took 22 minutes against a
      15-minute target.
    source: "Atlas Platform Migration status notes, tracking board export 2026.06.28."
  - id: "sync_notes_20260628"
    type: "interview"
    content: >-
      Weekly sync notes, 2026.06.28: Priya Nandakumar stated the program is on pace for
      a late-July cutover if the SLA countersignature lands by 2026.07.10, otherwise the
      July maintenance window is lost and cutover moves to September; Marcus Webb asked
