# Example DDO source of truth for the v0.0.2 adversarial-loop tutorial.
# This is the Biodegradable Polyester Optimization Report expressed as a
# `scientific_report` document_data.yaml. The methodological flaws are
# INTENTIONAL — they are what the scientific_reviewer persona red-teams in the
# tutorial. The document is otherwise validate()-clean and renders cleanly.
#
# Place under: Documents/2026.06.29_scientific_report_copolyester-optimization/

meta:
  doc_type: "scientific_report"
  title: "Copolyester Optimization"
  version: "1.0.0"
  date: "2026.06.29"            # dotted YYYY.MM.DD — NOT ISO hyphens (validation gate)
  authors:
    - "Example Author, DDO Tutorial Corpus"
  corresponding_author: "example@ddo.invalid"
  abstract: >-
    Multi-parameter optimization of aliphatic-aromatic copolyesters for
    sustainable packaging. The transition to sustainable consumer packaged goods
    requires polymers that balance mechanical durability with rapid environmental
    degradability. Five copolyester candidates (PX-101 through PX-105) are
    evaluated by balancing solubility, synthesizability, toxicity, and ecological
    impact to identify a pre-optimized blend capable of commercial scaling.
  keywords:
    - "biodegradable polyester"
    - "copolyester"
    - "multi-parameter optimization"
    - "sustainable packaging"
  status: "draft"
  persona: "scientific_reviewer"
  output_formats: ["pdf", "html", "md"]
  template: "scientific_report"
  review_log: []

content:
  sections:
    - id: "introduction"
      title: "1. Introduction"
      body: >-
        Current petrochemical-derived packaging materials exhibit exceptional
        barrier properties and high synthesis yields but persist in the
        environment for centuries. While biodegradable alternatives exist, they
        often suffer from low synthesizability (yield) or unacceptably high
        ecological footprints during manufacturing. This study evaluates five
        novel copolyester blends, aiming to maximize manufacturing yield and
        marine solubility while minimizing mammalian toxicity and carbon
        footprint.
      claims: []
      evidence: []

    - id: "methods"
      title: "2. Materials and Methods"
      body: >-
        Candidate selection relies on a composite desirability function. We
        evaluate the candidates across four primary metrics. The objective
        function Z is calculated using normalized weights for each parameter:
        Z = sum_i ( w_s * S_i + w_y * Y_i - w_t * T_i - w_e * E_i ), where
        S_i = Water Solubility (mg/L), Y_i = Synthesizability Yield (%),
        T_i = Toxicity LD50 (g/kg) measured via murine models, and
        E_i = Ecology Impact (kg CO2/kg resin). For this evaluation we apply a
        commercially balanced weighting scheme: w_s = 0.3, w_y = 0.4, w_t = 0.1,
        and w_e = 0.2.
      claims: []
      evidence: []

    - id: "results"
      title: "3. Results"
      body: >-
        The following table summarizes the raw empirical data collected during
        the Phase II trials. PX-101: Yield 82.0%, Solubility 45.0 mg/L, LD50 12.5
        g/kg, Ecology 4.2 kg CO2/kg. PX-102: Yield 91.5%, Solubility 12.0 mg/L,
        LD50 18.0 g/kg, Ecology 2.1 kg CO2/kg. PX-103: Yield 64.0%, Solubility
        88.0 mg/L, LD50 5.2 g/kg, Ecology 1.8 kg CO2/kg. PX-104: Yield 88.5%,
        Solubility 42.0 mg/L, LD50 15.4 g/kg, Ecology 2.5 kg CO2/kg. PX-105:
        Yield 75.0%, Solubility 60.0 mg/L, LD50 9.8 g/kg, Ecology 2.9 kg CO2/kg.
      claims: []
      evidence:
        - "phase_ii_dataset"

    - id: "discussion"
      title: "4. Discussion"
      body: >-
        Several structure-property trade-offs emerge. First, there is a distinct
        inverse correlation between manufacturing yield and water solubility:
        PX-102 achieved the highest yield (91.5%) but the lowest solubility (12.0
        mg/L), suggesting highly crystalline domains that resist hydrolysis,
        whereas PX-103 is highly amorphous and soluble (88.0 mg/L) but suffers
        from poor yield (64.0%) and higher toxicity. Second, PX-103 demonstrated
        the highest toxicity (lowest LD50 at 5.2 g/kg); gas chromatography
        indicates this is likely due to unreacted monomer residues trapped within
        the amorphous matrix. Third, applying the objective function Z, PX-104
        emerges as the optimal candidate: it achieves a commercially viable yield
        (88.5%) while maintaining adequate solubility (42.0 mg/L) and a low carbon
        footprint (2.5 kg CO2/kg).
      claims: []
      evidence: []

    - id: "conclusion"
      title: "5. Conclusion"
      body: >-
        Candidate PX-104 represents the most balanced copolyester for CPG
        applications. We recommend advancing PX-104 to Phase III pilot plant
        scaling. Future work will focus on optimizing the catalyst to push the
        solubility boundary of PX-104 closer to 50.0 mg/L without sacrificing
        yield.
      claims: []
      evidence: []

evidence_bank:
  - id: "phase_ii_dataset"
    type: "data"
    content: >-
      Phase II candidate evaluation metrics for PX-101 through PX-105: Yield (%),
      Water Solubility (mg/L), Toxicity LD50 (g/kg), and Ecology Impact
      (kg CO2/kg resin).
    source: "Phase II trial records, internal dataset"
