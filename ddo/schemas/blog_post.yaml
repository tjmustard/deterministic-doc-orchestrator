# Schema: Blog Post
# Enforces the DDO Minimal Contract (meta + evidence_bank)

meta:
  doc_type: "blog_post"
  title: "[REQUIRES USER INPUT]"
  version: "0.1.0"
  date: "[REQUIRES USER INPUT: dotted YYYY.MM.DD]"
  author: "[REQUIRES USER INPUT]"
  status: "draft"
  persona: "content_editor"
  # Optional. Absent => no-op (no style anchoring). Present-but-invalid ("" / null /
  # whitespace-only) => hard-fail. Resolves to ddo/styles/<stem>.md; <stem> must match
  # ^[a-z][a-z0-9_]*$.
  style_profile: "blog_casual"
  output_formats: ["pdf", "html", "md"]
  template: "blog_post"
  review_log: [] # Populated by ddo-refine

content:
  sections:
    - id: "hook"
      title: "Hook"
      body: "[REQUIRES USER INPUT: The opening 1-2 sentences that earn the read.]"
      claims: []
      evidence: []

    - id: "context"
      title: "Context"
      body: "[REQUIRES USER INPUT: The situation or problem the reader needs to know.]"
      claims: []
      evidence: []

    - id: "main_point"
      title: "Main Point"
      body: "[REQUIRES USER INPUT: The single core idea of the post, stated plainly.]"
      claims: []
      evidence: []

    - id: "supporting_detail"
      title: "Supporting Detail"
      body: "[REQUIRES USER INPUT: Evidence, examples, or a story that backs the main point.]"
      claims: []
      evidence: []

    - id: "conclusion_cta"
      title: "Wrap-Up & Next Step"
      body: "[REQUIRES USER INPUT: One concrete action for the reader to take next.]"
      claims: []
      evidence: []

evidence_bank:
  # Example node structure:
  # - id: "team_retro_notes_2026_05"
