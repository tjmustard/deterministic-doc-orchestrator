# Schema: Project Status Report
# Enforces the DDO Minimal Contract (meta + evidence_bank)

meta:
  doc_type: "project_report"
  title: "[REQUIRES USER INPUT]"
  version: "0.1.0"
  date: "[REQUIRES USER INPUT: ISO-8601]"
  authors: [] # Format: "First Last, Role"
  status: "draft"
  persona: "project_stakeholder"
  # Optional. Absent => no-op (no style anchoring). Present-but-invalid ("" / null /
  # whitespace-only) => hard-fail. Resolves to ddo/styles/<stem>.md; <stem> must match
  # ^[a-z][a-z0-9_]*$.
  style_profile: "executive_formal"
  output_formats: ["pdf", "html", "md"]
  template: "project_report"
  review_log: [] # Populated by ddo-refine

content:
  sections:
    - id: "executive_summary"
      title: "1. Executive Summary"
      body: "[REQUIRES USER INPUT: Front-loaded overall status and any decision requested of the reader.]"
      claims: []
      evidence: []

    - id: "status"
      title: "2. Status"
      body: "[REQUIRES USER INPUT: Overall project/workstream status, stated plainly.]"
      claims: []
      evidence: []

    - id: "milestones"
      title: "3. Milestones"
      body: "[REQUIRES USER INPUT: Each milestone with an explicit status word (done / at-risk / blocked / not-started).]"
      claims: []
      evidence: []

    - id: "risks"
      title: "4. Risks"
      body: "[REQUIRES USER INPUT: Known risks and blockers, with owners.]"
      claims: []
      evidence: []

    - id: "metrics"
      title: "5. Metrics"
      body: "[REQUIRES USER INPUT: Literal, source-traced figures only. No computed rollups.]"
      claims: []
      evidence: []

    - id: "next_steps"
      title: "6. Next Steps"
      body: "[REQUIRES USER INPUT: Concrete, owned, dated actions.]"
      claims: []
      evidence: []

evidence_bank:
  # Example node structure:
  # - id: "sprint_status_notes_2026_06_28"
  #   type: "status_update"
  #   content: "Milestone 3 (Data Migration Dry Run) completed 2026.06.15; Milestone 4 at 60%."
  #   source: "Atlas Platform Migration status notes, 2026.06.28."
