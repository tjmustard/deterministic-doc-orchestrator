[project]
name = "deterministic-doc-orchestrator"
version = "0.0.0"
requires-python = ">=3.10"
dependencies = []

[tool.ruff]
line-length = 100
exclude = ["PRDs/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "D"]
ignore = ["D100", "D104"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["ddo"]

[tool.ruff.format]
quote-style = "double"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.20",
]
