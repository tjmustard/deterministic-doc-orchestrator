[project]
name = "deterministic-doc-orchestrator"
version = "0.0.6"
requires-python = ">=3.10"
dependencies = []

[tool.ruff]
line-length = 100
exclude = ["PRDs/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "D"]
ignore = ["D100", "D104"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["ddo", "scripts"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["slow: full determinism cross-product (CI only)"]
addopts = "-m 'not slow'"

[dependency-groups]
dev = [
    "pypdf>=4.0",
    "pytest>=9.0.3",
    "ruff>=0.15.20",
]
